    stuck: ['זיהוי לפי "אב טיפוס" (מלבן שוכב) ולא לפי תכונות – הציגו מלבנים מסובבים (מדריך למורה).', 'ריבוע לא מזוהה כמלבן – שאלו: כמה זוויות ישרות יש לו?', 'במשימה 1ג: הצורה הימנית התחתונה במובייל אינה מצולע (אין לה צלעות) – כדאי לדון בזה (מדריך למורה).', 'לפני משימה 2 (מדריך למורה): לבקש לבנות מלבן מ-4 רצועות שונות באורכן – ולגלות שאי-אפשר.', 'במשימה 3 משלימים את הצלעות לפי התכונה (צלעות נגדיות שוות), לא במדידה.'] });
  upd('N1', { gen: genN1, explore: EXPLORE.N1, homework: HOMEWORK.N1, day: 'שלישי 1.12' });
  upd('N2', { gen: genN2, explore: EXPLORE.N2, homework: HOMEWORK.N2, day: 'שישי 4.12' });
  var g2 = lessonById('G2');
  if (g2) {
    upd('G2', { active: true, prev: 'G1', gen: genG2, explore: EXPLORE.G2, homework: HOMEWORK.G2, day: 'חמישי 3.12', title: 'תכונות המלבן ומלבנים בסרטוט מורכב',
      intro: { question: 'בסרטוט יש מלבן גדול שמחולק לחלקים. <b>כמה מלבנים אתם רואים?</b> רק את הקטנים?', visual: function (el, o) { VX.composite(el, Object.assign({ layout: 'three' }, o)); },
        definition: 'במלבן <b>כל שתי צלעות נגדיות שוות ומקבילות</b>, וכל ארבע הזוויות ישרות.<br>בסרטוט מורכב מחפשים גם מלבנים שמורכבים <b>מכמה חלקים</b>. סופרים לפי הסדר: חלק אחד, שני חלקים, שלושה…',
        example: 'מלבן שמחולק ל-3 חלקים בשורה: <span class="num">3 + 2 + 1 = 6</span> מלבנים.<br>שני חלקים שיחד יוצרים "מדרגה" – זה לא מלבן (יש לצורה 6 צלעות).' },
      wizdi: ['אמצעי המחשה "חקירת תכונות מלבן" (עמ׳ 40–48)', 'פעילות "צלעות וזוויות במלבן" (עמ׳ 41)'], props: ['מלבני נייר גזורים להנחה על הסרטוט (מדריך למורה)'],
      stuck: ['מומלץ (מדריך למורה): לסרטט ולגזור את המלבנים הקטנים, להניח כל אחד במקומו ולספור; להראות שמלבן גדול מורכב משני קטנים.', 'ילדים שוכחים את המלבן הגדול כולו – סופרים לפי מספר החלקים.', 'שני חלקים סמוכים לא תמיד יוצרים מלבן (צורת "מדרגה").'] });
  }
})();
</script>

<script>
/* ================= Teacher mode ================= */
var Teacher = (function () {
  var T = { token: null, data: null, tab: 'today', appUrl: BOOT.appUrl, current: { N: '', G: '' } };

  function start() {
    document.body.classList.add('wide');
    T.token = load('math5_tt');
    if (T.token) { refresh().then(menu).catch(function () { T.token = null; store('math5_tt', null); loginScreen(); }); }
    else loginScreen();
  }

  function loginScreen() {
    setApp('<div class="card" style="max-width:420px;margin:40px auto"><h1>מצב מורה</h1><p class="muted">בכניסה הראשונה, הסיסמה שתקלידו תישמר כסיסמת המורה.</p>' +
      '<input id="pw" type="password" class="answer-input" style="max-width:none;font-size:1.2rem" placeholder="סיסמה"><p></p><button class="btn block" id="go">כניסה</button>' +
      '<p style="text-align:center"><button class="linkbtn small" id="back">חזרה למסך התלמידים</button></p></div>');
    $('#pw').focus();
    $('#pw').onkeydown = function (e) { if (e.key === 'Enter') $('#go').click(); };
    $('#back').onclick = function () { document.body.classList.remove('wide'); BOOT.teacher = ''; startApp(); };
    $('#go').onclick = function () {
      api('api_teacherLogin', $('#pw').value).then(function (r) {
        T.token = r.token; store('math5_tt', r.token); if (r.appUrl && !window.HOSTED_URL) T.appUrl = r.appUrl;
        if (r.firstTime) toast('הסיסמה נשמרה. זכרו אותה!', 3500);
        return refresh();
      }).then(menu).catch(function (e) { toast(errMsg(e)); });
    };
  }

  function refresh() {
    return api('api_teacherData', T.token).then(function (d) {
      T.data = d; if (d.appUrl && !window.HOSTED_URL) T.appUrl = d.appUrl;
      return api('api_current').catch(function () { return null; }); // older server: no fixed-QR support yet
    }).then(function (cur) {
      T.current = cur || T.current;
      if (BOOT.set) {
        var want = BOOT.set; BOOT.set = '';
        return api('api_setCurrent', T.token, want).catch(function () { toast('צריך לעדכן את השרת כדי להפעיל קוד קבוע'); return null; }).then(function (c2) {
          if (!c2) return;
          T.current = c2; T.tab = 'today';
          var L = lessonById(want);
          toast('✓ הקוד הקבוע של ' + trackName(want.charAt(0)) + ' מוביל עכשיו ל: ' + (L ? L.title : want), 4500);
        });
      }
    });
  }

  var TABS = [['today', 'שיעור היום'], ['intro', 'הקניה'], ['map', 'מפת כיתה'], ['groups', 'קבוצות לפרטני'], ['qr', 'QR להדפסה'], ['settings', 'הגדרות']];
  function menu() {
    var html = '<div class="spread no-print"><h1>מתמטיקה ה׳ – מצב מורה</h1><button class="btn small ghost" id="logoutT">יציאה</button></div>' +
      '<div class="tabs no-print">' + TABS.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (T.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><div id="tview"></div>';
    setApp(html);
    $all('.tabs button').forEach(function (b) { b.onclick = function () { T.tab = b.getAttribute('data-t'); menu(); }; });
    $('#logoutT').onclick = function () { store('math5_tt', null); T.token = null; loginScreen(); };
    ({ today: today, intro: introList, map: classMap, groups: groups, qr: qrPage, settings: settings })[T.tab]($('#tview'));
  }

  /* ---------- Today's lesson (fixed QR per subject) ---------- */
  function subjectUrl(track) { return (T.appUrl || BOOT.appUrl) + '?s=' + track; }
  function today(el) {
    var html = '<p class="muted">לכל מקצוע יש קוד QR קבוע אחד שתלוי בכיתה. בחרו את השיעור של היום ולחצו "הפעלה". מעכשיו הקוד הקבוע יוביל את הילדים לשיעור הזה.</p><div class="qr-grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">';
    ['N', 'G'].forEach(function (tr) {
      var cur = lessonById(T.current[tr]);
      var opts = LESSONS.filter(function (l) { return l.track === tr && l.active && !l.review; }).sort(function (a, b) { return a.order - b.order; })
        .map(function (l) { return '<option value="' + l.id + '"' + (cur && cur.id === l.id ? ' selected' : '') + '>' + esc(l.order + '. ' + l.title + ' (' + l.day + ')') + '</option>'; }).join('');
      html += '<div class="qr-card track-' + tr.toLowerCase() + '">' + trackPill(tr) + '<h3>קוד קבוע – ' + trackName(tr) + '</h3>' +
        '<div class="small">פעיל עכשיו: <b>' + (cur ? esc(cur.title) : 'עוד לא נבחר') + '</b></div>' + qrImg(subjectUrl(tr), 6) +
        (cur && cur.homework ? '<div class="small" style="text-align:right;margin:6px 0">📒 <b>שיעורי בית:</b> ' + cur.homework.map(esc).join(' · ') + '</div>' : '') +
        '<div class="row no-print" style="justify-content:center"><select data-tr="' + tr + '">' + opts + '</select><button class="btn small" data-set="' + tr + '">הפעלה</button><button class="btn small ghost" data-big="' + tr + '">להקרנה</button></div></div>';
    });
    el.innerHTML = html + '</div>';
    $all('[data-set]', el).forEach(function (b) {
      b.onclick = function () {
        var tr = b.getAttribute('data-set'), id = $('select[data-tr="' + tr + '"]', el).value;
        api('api_setCurrent', T.token, id).then(function (c) { T.current = c; toast('✓ הקוד הקבוע מוביל עכשיו ל: ' + lessonById(id).title); menu(); }).catch(function (e) { toast(errMsg(e)); });
      };
    });
    $all('[data-big]', el).forEach(function (b) {
      b.onclick = function () {
        var tr = b.getAttribute('data-big'), cur = lessonById(T.current[tr]);
        setApp('<div class="slide card"><div class="spread no-print"><button class="btn small ghost" id="exit">✕ סגירה</button></div><div class="stage">' + trackPill(tr) +
          '<h1>' + (cur ? esc(cur.title) : trackName(tr)) + '</h1>' + qrImg(subjectUrl(tr), 12) + '<div class="lead">סורקים במצלמה של הטלפון</div></div></div>');
        $('#exit').onclick = menu;
      };
    });
  }

  /* ---------- Intro / slides ---------- */
  function teachable() { return LESSONS.filter(function (l) { return l.active; }).sort(function (a, b) { return (a.track + a.order) > (b.track + b.order) ? 1 : -1; }); }
  function introList(el) {
    el.innerHTML = '<p class="muted">בחרו שיעור להקרנה על הלוח.</p>' + ['N', 'G'].map(function (t) {
      return '<div class="card track-' + t.toLowerCase() + '"><h3>' + trackName(t) + '</h3><div class="lesson-list">' + teachable().filter(function (l) { return l.track === t; }).map(function (l) {
        return '<button data-l="' + l.id + '"><span class="grow"><b>' + esc(l.title) + '</b><br><span class="small muted">' + esc(l.day) + ' · עמ׳ ' + l.pages + '</span></span><span class="pill">להקרנה ←</span></button>';
      }).join('') + '</div></div>';
    }).join('');
    $all('.lesson-list button', el).forEach(function (b) { b.onclick = function () { slides(lessonById(b.getAttribute('data-l'))); }; });
  }

  function slides(L) {
    var i = 0, notes = false;
    var I = L.intro;
    var prev = L.prev ? lessonById(L.prev) : null;
    var S_ = [
      function () { return '<h1>' + esc(L.title) + '</h1><div class="lead">' + trackPill(L.track) + ' · עמ׳ ' + L.pages + ' בחוברת</div>' + (prev && !L.review ? '<div class="lead">🔎 בדיקת פתיחה (5 דקות): סרקו את ה-QR של השיעור, ענו על 5 שאלות על "' + esc(prev.title) + '"</div><div id="slqr"></div>' : ''); },
      function () { return '<div class="lead">🤔</div><div class="lead">' + I.question + '</div>'; },
      function () { return '<div id="slvis" style="width:100%"></div>'; },
      function () { return '<div class="lead">📘 מה חשוב לזכור</div><div class="def">' + I.definition + '</div>'; },
      function () { return '<div class="lead">✏️ דוגמה פתורה</div><div class="lead" style="text-align:right">' + I.example + '</div>'; },
      function () { return '<h1>עכשיו בטלפון 📱</h1><div class="lead">סרקו את הקוד ← ' + (L.explore ? 'קודם <b>המחשה</b> (כ-4 דקות), ואז תרגול.' : 'ענו על השאלות.') + ' יש רמזים 🙂</div><div id="slqr2"></div>'; }
    ];
    if (L.explore) { // the same interactive screens the students see on the phone, one per slide
      var exS = L.explore.map(function (sc, k) {
        var f = function () {
          var q = sc.q;
          return '<div class="lead">👀 ' + esc(sc.title) + ' <span class="muted small">(' + (k + 1) + '/' + L.explore.length + ')</span></div><div class="small muted">' + sc.text + '</div><div id="slvis" class="exvis" style="width:100%"></div>' +
            '<div class="lead" style="margin-top:10px">' + q.prompt + '</div><div id="slans" class="lead" style="min-height:40px"></div><button class="btn small ghost no-print" id="reveal">הצגת תשובה</button>';
        };
        f.vis = sc.vis; f.ans = sc.q.options ? sc.q.options.filter(function (o) { return o[1]; })[0][2] : '<b>' + fmt(sc.q.num) + '</b> – ' + sc.q.okText.replace(/^נכון!\s*/, '');
        return f;
      });
      S_.splice.apply(S_, [2, 1].concat(exS));
    }
    if (L.homework && L.homework.length) S_.push(function () { return '<h1>📒 שיעורי בית</h1><div class="lead" style="text-align:right">בחוברת:<ul>' + L.homework.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('') + '</ul></div>'; });
    function draw() {
      var html = '<div class="slide card"><div class="spread no-print"><button class="btn small ghost" id="exit">✕ סגירה</button><span class="muted">' + (i + 1) + '/' + S_.length + '</span>' +
        '<button class="btn small ghost" id="nt">' + (notes ? 'הסתרת הערות' : 'הערות למורה') + '</button></div>' +
        '<div class="stage">' + S_[i]() + '</div>' +
        '<div class="spread no-print"><button class="btn ghost" id="pv"' + (i === 0 ? ' disabled' : '') + '>→ הקודם</button><button class="btn" id="nx"' + (i === S_.length - 1 ? ' disabled' : '') + '>הבא ←</button></div></div>';
      if (notes) html += '<div class="notes"><b>בוויזדי:</b> ' + (L.wizdi || []).map(esc).join(' · ') + '<br><b>אביזרים מהספר:</b> ' + ((L.props || []).map(esc).join(' · ') || '—') + '<br><b>שיעורי בית:</b> ' + ((L.homework || []).map(esc).join(' · ') || '—') + '<br><b>איפה נתקעים:</b><ul>' + (L.stuck || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>';
      setApp(html);
      if ($('#slvis')) (S_[i].vis || I.visual)($('#slvis'), { proj: true });
      if ($('#reveal')) $('#reveal').onclick = function () { $('#slans').innerHTML = '✅ ' + S_[i].ans; };
      if ($('#slqr')) $('#slqr').innerHTML = qrImg(lessonUrl(L), 7);
      if ($('#slqr2')) $('#slqr2').innerHTML = qrImg(lessonUrl(L), 8);
      $('#pv').onclick = function () { if (i > 0) { i--; draw(); } };
      $('#nx').onclick = function () { if (i < S_.length - 1) { i++; draw(); } };
      $('#exit').onclick = function () { document.onkeydown = null; menu(); };
      $('#nt').onclick = function () { notes = !notes; draw(); };
    }
    document.onkeydown = function (e) {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === ' ' || e.key === 'PageDown') { if (i < S_.length - 1) { i++; draw(); } }
      if (e.key === 'ArrowRight' || e.key === 'PageUp') { if (i > 0) { i--; draw(); } }
    };
    draw();
  }

  /* ---------- Data helpers ---------- */
  function latest(id, lesson, phases) {
    var best = null;
    T.data.summaries.forEach(function (s) { if (s.id === id && s.lesson === lesson && phases.indexOf(s.phase) >= 0 && (!best || s.t >= best.t)) best = s; });
    return best;
  }
  function nextLesson(L) { return LESSONS.filter(function (x) { return x.track === L.track && !x.review && x.order === L.order + 1; })[0]; }
  function mastery(id, L) {
    var nx = nextLesson(L);
    var chk = nx ? latest(id, nx.id, [PHASE.CHECK]) : null;
    var pr = latest(id, L.id, [PHASE.PRACTICE, PHASE.CATCHUP]);
    return { practice: pr ? pr.score : null, check: chk ? chk.score : null, value: chk ? chk.score : (pr ? pr.score : null), catchup: pr && pr.phase === PHASE.CATCHUP };
  }
  function focusOf(id, lesson, phases) {
    var f = (((T.data.focus || {})[id] || {})[lesson]) || {}, o = { leaves: 0, away: 0, fast: 0, items: 0 };
    Object.keys(f).forEach(function (ph) { if (phases && phases.indexOf(ph) < 0) return; o.leaves += f[ph].leaves; o.away += f[ph].away; o.fast += f[ph].fast; o.items += f[ph].items; });
    return o;
  }
  function focusCell(id, L) {
    var nx = nextLesson(L), p = focusOf(id, L.id, [PHASE.PRACTICE, PHASE.CATCHUP]), c = nx ? focusOf(id, nx.id, [PHASE.CHECK]) : { leaves: 0, fast: 0 };
    return { leaves: p.leaves + c.leaves, fast: p.fast + c.fast, checkLeaves: c.leaves };
  }
  function times(n) { return n === 1 ? 'פעם אחת' : n + ' פעמים'; }
  function focusText(o) { return (o.leaves ? 'יצא/ה מהמסך ' + times(o.leaves) + (o.away ? ' (' + o.away + ' שנ׳)' : '') : '') + (o.leaves && o.fast ? ' · ' : '') + (o.fast ? '⚡ ' + o.fast + ' תשובות מהירות מהרגיל' : ''); }
  function cellClass(v) { return v == null ? 'cell-n' : v >= 80 ? 'cell-g' : v >= 60 ? 'cell-y' : 'cell-r'; }
  function errorsOf(id, lessons) {
    var e = (T.data.errors || {})[id] || {}, out = {};
    Object.keys(e).forEach(function (l) { if (lessons && lessons.indexOf(l) < 0) return; Object.keys(e[l]).forEach(function (k) { out[k] = (out[k] || 0) + e[l][k]; }); });
    return out;
  }
  function topErrors(obj, n, min) { return Object.keys(obj).filter(function (k) { return k !== 'missed' && k !== 'wrong_pick' && obj[k] >= (min || 1); }).sort(function (a, b) { return obj[b] - obj[a]; }).slice(0, n || 3); }
  function mapLessons() { return LESSONS.filter(function (l) { return l.active && !l.review; }).sort(function (a, b) { return a.track === b.track ? a.order - b.order : (a.track === 'N' ? -1 : 1); }); }

  /* ---------- Class map ---------- */
  function classMap(el) {
    var ls = mapLessons();
    var html = '<div class="spread no-print"><div class="small"><span class="pill ok">80%+ שולט</span> <span class="pill warn">60–79% בדרך</span> <span class="pill bad">מתחת ל-60% זקוק לתמיכה</span> <span class="muted">· הציון: בדיקת הפתיחה של השיעור הבא, ואם עדיין אין – התרגול</span></div>' +
      '<div class="row"><button class="btn small ghost" id="rf">רענון</button><button class="btn small ghost" id="csv">ייצוא לאקסל</button><a class="btn small ghost" target="_blank" href="' + esc(T.data.sheetUrl) + '">גיליון התיעוד</a></div></div>';
    html += '<div class="card map-wrap"><table class="map"><tr><th>תלמיד/ה</th><th>⭐</th>' + ls.map(function (l) { return '<th title="' + esc(l.title) + '">' + (l.track === 'N' ? 'מס׳ ' : 'גאו׳ ') + l.order + '<br><span class="small muted">' + esc(l.title.slice(0, 18)) + '</span></th>'; }).join('') + '<th>מה לחזק</th></tr>';
    T.data.students.forEach(function (s) {
      html += '<tr><td class="name" data-id="' + s.id + '">' + esc(s.name) + (s.level ? ' <span class="pill">ר' + s.level + '</span>' : '') + '</td><td>' + s.stars + '</td>';
      ls.forEach(function (l) {
        var m = mastery(s.id, l);
        html += '<td class="' + cellClass(m.value) + '" title="תרגול: ' + (m.practice == null ? '—' : m.practice + '%') + ' · בדיקה: ' + (m.check == null ? '—' : m.check + '%') + '">' + (m.value == null ? '·' : '<span class="num">' + m.value + '%' + (m.catchup ? '*' : '') + '</span>') + (function () { var fc = focusCell(s.id, l); return (fc.leaves ? ' <span class="flag" title="יצא/ה מהמסך ' + times(fc.leaves) + (fc.checkLeaves ? ', מהן ' + fc.checkLeaves + ' בבדיקה' : '') + '">👀</span>' : '') + (fc.fast >= 2 ? ' <span class="flag" title="' + fc.fast + ' תשובות מהירות מהרגיל">⚡</span>' : ''); })() + '</td>';
      });
      var te = topErrors(errorsOf(s.id), 2);
      html += '<td class="small" style="text-align:right">' + te.map(function (k) { return esc(errLabel(k)); }).join('<br>') + '</td></tr>';
    });
    html += '</table><p class="small muted">* = הושלם בהשלמה (אחרי היעדרות). 👀 = יצא/ה מהמסך באמצע שאלה. ⚡ = כמה תשובות נכונות מהירות בהרבה מהקצב הרגיל של הילד/ה. שני הסימנים הם סיבה לבדוק, לא הוכחה. לחצו על שם לפרטים, לקביעת רמה, לאיפוס קוד ולדוח להורים.</p></div>';
    el.innerHTML = html;
    $('#rf').onclick = function () { refresh().then(menu); };
    $('#csv').onclick = exportCsv;
    $all('td.name', el).forEach(function (td) { td.onclick = function () { studentDetail(td.getAttribute('data-id')); }; });
  }

  function studentDetail(id) {
    var s = T.data.students.filter(function (x) { return x.id === id; })[0];
    var ls = mapLessons();
    var errs = errorsOf(id), te = topErrors(errs, 3, 2);
    var html = '<div class="spread no-print"><button class="btn small ghost" id="bk">→ חזרה למפה</button><div class="row"><button class="btn small" id="rep">דוח להורים</button></div></div>';
    html += '<div class="card"><h2>' + esc(s.name) + '</h2><div class="row"><span class="stars">⭐ ' + s.stars + '</span>' +
      '<label>רמה: <select id="lvl"><option value="">אוטומטית</option><option value="1">1 – בסיס</option><option value="2">2 – ביניים</option><option value="3">3 – אתגר</option></select></label>' +
      '<button class="btn small ghost" id="rpin">איפוס קוד כניסה</button>' + (s.hasPin ? '' : '<span class="pill warn">עוד לא נכנס/ה</span>') + '</div></div>';
    html += '<div class="card"><h3>לפי שיעור</h3><table class="map"><tr><th>שיעור</th><th>תרגול</th><th>בדיקה בשיעור הבא</th><th>טעויות בולטות</th></tr>' + ls.map(function (l) {
      var m = mastery(id, l), le = topErrors(errorsOf(id, [l.id]), 2);
      return '<tr><td style="text-align:right">' + esc(l.title) + '</td><td class="' + cellClass(m.practice) + '">' + (m.practice == null ? '—' : m.practice + '%' + (m.catchup ? ' (השלמה)' : '')) + '</td><td class="' + cellClass(m.check) + '">' + (m.check == null ? '—' : m.check + '%') + '</td><td class="small" style="text-align:right">' + le.map(function (k) { return esc(errLabel(k)) + ' (' + errorsOf(id, [l.id])[k] + ')'; }).join('<br>') + '</td></tr>';
    }).join('') + '</table></div>';
    var frows = ls.map(function (l) {
      var p = focusOf(id, l.id, [PHASE.PRACTICE, PHASE.CATCHUP]), nx = nextLesson(l), c = nx ? focusOf(id, nx.id, [PHASE.CHECK]) : focusOf('', '', []);
      if (!p.leaves && !p.fast && !c.leaves && !c.fast) return '';
      return '<tr><td style="text-align:right">' + esc(l.title) + '</td><td class="small">' + (focusText(p) || '—') + '</td><td class="small">' + (focusText(c) || '—') + '</td></tr>';
    }).join('');
    html += '<div class="card"><h3>👀 יציאה מהמסך ותשובות מהירות</h3>' + (frows ? '<table class="map"><tr><th>שיעור</th><th>בתרגול</th><th>בבדיקה בשיעור הבא</th></tr>' + frows + '</table><p class="small muted">סיבה לבירור, לא הוכחה: יציאה יכולה להיות גם הודעה או כיבוי מסך. כדאי לבקש מהילד/ה לפתור מולך תרגיל דומה.</p>' : '<p class="muted">לא נרשמו יציאות מהמסך.</p>') + '</div>';
    html += '<div class="card"><h3>המלצות לתרגול</h3>' + (te.length ? te.map(function (k) { return '<p>• <b>' + esc(errLabel(k)) + '</b> (' + errs[k] + ' פעמים): ' + esc((ERR[k] && ERR[k].rec) || '') + (ERR[k] && ERR[k].review ? ' <span class="pill">מאגר חזרה: ' + esc(lessonById(ERR[k].review).title) + '</span>' : '') + '</p>'; }).join('') : '<p class="muted">אין עדיין מספיק נתונים.</p>') + '</div>';
    setApp(html);
    $('#lvl').value = s.level || '';
    $('#lvl').onchange = function () { var v = $('#lvl').value; api('api_setLevel', T.token, id, v).then(function () { s.level = v; toast('הרמה נשמרה'); }).catch(function (e) { toast(errMsg(e)); }); };
    $('#rpin').onclick = function () { if (!confirm('לאפס את קוד הכניסה של ' + s.name + '? בכניסה הבאה הוא/היא יבחר/תבחר קוד חדש.')) return; api('api_resetPin', T.token, id).then(function () { s.hasPin = false; toast('הקוד אופס'); }).catch(function (e) { toast(errMsg(e)); }); };
    $('#bk').onclick = function () { T.tab = 'map'; menu(); };
    $('#rep').onclick = function () { parentReport(id); };
  }

  function parentReport(id) {
    var s = T.data.students.filter(function (x) { return x.id === id; })[0];
    var ls = mapLessons().filter(function (l) { var m = mastery(id, l); return m.value != null; });
    var errs = errorsOf(id), te = topErrors(errs, 3, 2);
    var strong = ls.filter(function (l) { return mastery(id, l).value >= 80; });
    var d = new Date();
    var html = '<div class="no-print spread" style="margin-bottom:10px"><button class="btn small ghost" id="bk">→ חזרה</button><button class="btn small" onclick="window.print()">הדפסה / שמירה כ-PDF</button></div>' +
      '<div class="report"><div class="spread"><div><h2>דוח התקדמות במתמטיקה</h2><div>כיתה ה׳ · בית ספר בורוכוב</div></div><div class="muted">' + d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear() + '</div></div>' +
      '<h3 style="margin-top:16px">' + esc(s.name) + '</h3>' +
      (ls.length ? '<table><tr><th>נושא</th><th>ציון בתרגול</th><th>בדיקת המשך</th></tr>' + ls.map(function (l) { var m = mastery(id, l); return '<tr><td>' + esc(l.title) + '</td><td>' + (m.practice == null ? '—' : m.practice + '%') + '</td><td>' + (m.check == null ? '—' : m.check + '%') + '</td></tr>'; }).join('') + '</table>' : '<p class="muted">עדיין אין נתונים.</p>') +
      '<h3>חוזקות</h3><p>' + (strong.length ? 'שולט/ת היטב ב: ' + strong.map(function (l) { return esc(l.title); }).join(', ') + '.' : 'נמשיך לבנות את הבסיס יחד.') + '</p>' +
      '<h3>מה כדאי לחזק</h3>' + (te.length ? '<ul>' + te.map(function (k) { return '<li><b>' + esc(errLabel(k)) + '</b>: ' + esc((ERR[k] && ERR[k].rec) || '') + '</li>'; }).join('') + '</ul>' : '<p>אין נושא בולט לחיזוק כרגע.</p>') +
      '<h3>איך אפשר לעזור בבית</h3><p>לבקש מ' + esc(s.name.split(' ')[0]) + ' להסביר לכם תרגיל אחד מהחוברת, בקול ובמילים שלו/ה. ההסבר מחזק את ההבנה יותר מעוד תרגול.</p>' +
      '<p>כוכבי מאמץ שנצברו: ⭐ ' + s.stars + '</p><p style="margin-top:30px">בברכה,<br>אליאור יפרח, מחנך הכיתה</p></div>';
    setApp(html);
    $('#bk').onclick = function () { studentDetail(id); };
  }

  function exportCsv() {
    var ls = mapLessons();
    var rows = [['שם', 'כוכבים', 'רמה'].concat(ls.map(function (l) { return l.title + ' – תרגול'; }), ls.map(function (l) { return l.title + ' – בדיקה'; }), ['טעויות בולטות', 'יציאות מהמסך', 'תשובות מהירות'])];
    T.data.students.forEach(function (s) {
      var te = topErrors(errorsOf(s.id), 3);
      rows.push([s.name, s.stars, s.level || 'אוטומטית'].concat(ls.map(function (l) { var m = mastery(s.id, l); return m.practice == null ? '' : m.practice; }), ls.map(function (l) { var m = mastery(s.id, l); return m.check == null ? '' : m.check; }), [te.map(errLabel).join('; ')], (function () { var t = { leaves: 0, fast: 0 }; Object.keys((T.data.focus || {})[s.id] || {}).forEach(function (l) { var o = focusOf(s.id, l); t.leaves += o.leaves; t.fast += o.fast; }); return [t.leaves, t.fast]; })()));
    });
    var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    try {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'מתמטיקה-ה-מפת-כיתה.csv';
      document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500);
      toast('הקובץ ירד. אפשר לפתוח אותו באקסל.');
    } catch (e) { toast('ההורדה נחסמה. אפשר לפתוח את גיליון התיעוד ולהוריד ממנו.'); }
  }

  /* ---------- Groups ---------- */
  function groups(el) {
    var ls = mapLessons();
    var opts = '<option value="">כל השיעורים</option>' + ls.map(function (l) { return '<option value="' + l.id + '">' + esc(l.title) + '</option>'; }).join('');
    el.innerHTML = '<div class="row no-print"><label>שיעור: <select id="gl">' + opts + '</select></label></div><div id="gv"></div>';
    function draw() {
      var lid = $('#gl').value, filter = lid ? [lid] : null;
      var byErr = {};
      T.data.students.forEach(function (s) {
        var e = errorsOf(s.id, filter);
        Object.keys(e).forEach(function (k) { if (k === 'missed' || k === 'wrong_pick') return; if (e[k] >= 2) { byErr[k] = byErr[k] || []; byErr[k].push(s.name + ' (' + e[k] + ')'); } });
      });
      var notYet = lid ? T.data.students.filter(function (s) { return !latest(s.id, lid, [PHASE.PRACTICE, PHASE.CATCHUP]); }).map(function (s) { return s.name; }) : [];
      var keys = Object.keys(byErr).sort(function (a, b) { return byErr[b].length - byErr[a].length; });
      var html = keys.length ? keys.map(function (k) {
        return '<div class="card"><h3>' + esc(errLabel(k)) + ' <span class="pill">' + byErr[k].length + ' תלמידים</span></h3><p>' + byErr[k].map(esc).join(' · ') + '</p><p class="small"><b>מה לעשות בפרטני:</b> ' + esc((ERR[k] && ERR[k].rec) || '') + '</p></div>';
      }).join('') : '<p class="muted">אין עדיין טעויות שחוזרות פעמיים ומעלה.</p>';
      if (notYet.length) html += '<div class="card"><h3>עוד לא תרגלו את השיעור</h3><p>' + notYet.map(esc).join(' · ') + '</p></div>';
      $('#gv').innerHTML = html;
    }
    $('#gl').onchange = draw; draw();
  }

  /* ---------- QR ---------- */
  function lessonUrl(L) { return (T.appUrl || BOOT.appUrl) + '?l=' + L.id; }
  function qrImg(text, cell) {
    try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return '<img alt="QR" src="' + q.createDataURL(cell || 6, 8) + '" style="width:' + ((cell || 6) * 33) + 'px;max-width:100%;image-rendering:pixelated">'; }
    catch (e) { return '<p class="small">' + esc(text) + '</p>'; }
  }
  function qrPage(el) {
    var ls = LESSONS.filter(function (l) { return l.active && !l.review; });
    var html = '<div class="spread no-print"><p class="muted">הדפיסו ותלו בכיתה, או הקרינו על הלוח. כל קוד פותח את השיעור ישירות.</p><button class="btn small" onclick="window.print()">הדפסה</button></div><div class="qr-grid">';
    html += ls.map(function (l) { return '<div class="qr-card">' + trackPill(l.track) + '<h3>' + esc(l.title) + '</h3><div class="small muted">' + esc(l.day) + ' · עמ׳ ' + l.pages + '</div>' + qrImg(lessonUrl(l), 5) + '</div>'; }).join('');
    html += '<div class="qr-card"><span class="pill ok">כללי</span><h3>כל השיעורים שלי</h3><div class="small muted">כניסה כללית</div>' + qrImg(T.appUrl || BOOT.appUrl, 5) + '</div></div>';
    html += '<div class="card no-print"><h3>שיעורים מתוכננים (עוד לא נבנו)</h3><p class="small">' + LESSONS.filter(function (l) { return !l.active; }).map(function (l) { return esc(l.title); }).join(' · ') + '</p></div>';
    el.innerHTML = html;
  }

  /* ---------- Settings ---------- */
  function settings(el) {
    el.innerHTML = '<div class="card"><h3>קישור לאפליקציה</h3><p class="num small" style="word-break:break-all">' + esc(T.appUrl) + '</p>' + qrImg(T.appUrl, 4) + '</div>' +
      '<div class="card"><h3>גיליון התיעוד</h3><p>כל הנתונים נשמרים בגוגל שיטס בדרייב שלך.</p><a class="btn small ghost" target="_blank" href="' + esc(T.data.sheetUrl) + '">פתיחת הגיליון</a></div>' +
      '<div class="card"><h3>החלפת סיסמת מורה</h3><input id="np" type="password" class="answer-input" style="max-width:260px;font-size:1.1rem" placeholder="סיסמה חדשה"> <button class="btn small" id="cp">שמירה</button></div>';
    $('#cp').onclick = function () { api('api_changeTeacherPassword', T.token, $('#np').value).then(function () { toast('הסיסמה עודכנה'); $('#np').value = ''; }).catch(function (e) { toast(errMsg(e)); }); };
  }

  return { start: start };
})();
</script>

<script>startApp();</script>
</body>
</html>
