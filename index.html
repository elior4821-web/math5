<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#22303c; --muted:#6b7785; --line:#e3ddd2;
  --primary:#2f6fde; --primary-d:#2358b5; --ok:#1f9d6b; --ok-bg:#e3f6ee; --bad:#d9534f; --bad-bg:#fdecea;
  --warn:#e8a317; --warn-bg:#fff5dc; --n:#2f6fde; --n-bg:#e7efff; --g:#8a4fd6; --g-bg:#f1e9ff;
  --u:#e4572e; --t:#2a9d8f; --h:#3a86ff; --th:#8338ec; --tth:#ff006e; --m:#6c757d;
  --radius:18px; --shadow:0 4px 16px rgba(34,48,60,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:17px;line-height:1.45}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input{font-family:inherit}
#app{max-width:560px;margin:0 auto;padding:12px 12px 90px;min-height:100vh}
body.wide #app{max-width:1200px}
.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;gap:10px}
.spinner{width:42px;height:42px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.5rem;margin:.3em 0}
h2{font-size:1.25rem;margin:.3em 0}
h3{font-size:1.08rem;margin:.3em 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1}
.btn{border:0;border-radius:14px;padding:14px 18px;background:var(--primary);color:#fff;font-weight:700;min-height:52px;box-shadow:0 3px 0 var(--primary-d);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--primary-d)}
.btn.block{display:block;width:100%}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #157a52}
.btn.warn{background:var(--warn);box-shadow:0 3px 0 #b57e0f;color:#2b2000}
.btn.small{min-height:40px;padding:8px 12px;font-size:.92rem}
.btn:disabled{opacity:.45}
.linkbtn{background:none;border:0;color:var(--primary);text-decoration:underline;padding:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:500;background:var(--n-bg);color:var(--n)}
.pill.g{background:var(--g-bg);color:var(--g)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:#8a5b00}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.hidden{display:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#22303c;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:90vw;text-align:center}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}

/* Topbar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fff;box-shadow:var(--shadow);flex:none}
.stars{font-weight:700;color:#8a5b00;background:var(--warn-bg);border-radius:999px;padding:4px 10px}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),#58a6ff);border-radius:99px;transition:width .3s}

/* Roster */
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roster button{background:#fff;border:0;border-radius:14px;padding:14px 6px;box-shadow:var(--shadow);font-weight:500;min-height:58px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:10px auto}
.pinpad button{height:64px;border-radius:16px;border:0;background:#fff;box-shadow:var(--shadow);font-size:1.5rem;font-weight:700}
.pindots{display:flex;justify-content:center;gap:14px;margin:14px 0}
.pindots span{width:20px;height:20px;border-radius:50%;border:3px solid var(--primary)}
.pindots span.f{background:var(--primary)}
.companions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.companions button{background:#fff;border:3px solid transparent;border-radius:18px;padding:12px 4px;box-shadow:var(--shadow)}
.companions button.sel{border-color:var(--primary)}
.companions .face{font-size:46px;display:block}

/* Lesson home */
.steps .step{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#faf8f4;margin:8px 0}
.steps .step .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--line);flex:none}
.steps .step.done .dot{background:var(--ok);color:#fff}
.steps .step.now{background:var(--n-bg)}
.track-n{border-top:6px solid var(--n)}
.track-g{border-top:6px solid var(--g)}
.lesson-list button{display:flex;width:100%;text-align:right;gap:10px;align-items:center;background:#fff;border:0;border-radius:14px;padding:12px;margin:6px 0;box-shadow:var(--shadow)}

/* Companion bubble */
.buddy{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.bubble{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);position:relative;flex:1}
.buddy.ok .bubble{background:var(--ok-bg)}
.buddy.bad .bubble{background:var(--warn-bg)}

/* Item */
.prompt{font-size:1.12rem;font-weight:500;margin:4px 0 10px}
.visual{display:flex;justify-content:center;margin:8px 0}
.answer-input{font-size:1.6rem;text-align:center;width:100%;max-width:260px;padding:10px;border-radius:14px;border:3px solid var(--line);direction:ltr}
.answer-input:focus{outline:none;border-color:var(--primary)}
.options{display:grid;gap:10px;margin:10px 0}
.options.two{grid-template-columns:1fr 1fr}
.options.three{grid-template-columns:1fr 1fr 1fr}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;font-size:1.08rem;font-weight:500;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center}
.opt.sel{border-color:var(--primary);background:var(--n-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt svg{max-width:100%;height:auto}
.feedback{margin-top:10px}

/* Place value house */
.pvh{border-collapse:separate;border-spacing:4px;direction:ltr;margin:0 auto}
.pvh th{font-size:.78rem;font-weight:700;color:#fff;border-radius:8px;padding:4px 2px;min-width:40px}
.pvh td{text-align:center;font-size:1.45rem;font-weight:700;height:46px;min-width:40px;border-radius:8px;background:#faf8f4}
.pvh td.op{background:none;color:var(--muted);min-width:22px}
.pvh tr.sum td{border-top:3px solid var(--ink);background:#fff}
.pvh tr.carry td{height:26px;font-size:.95rem;color:var(--bad);background:none}
.pvh td.hl{outline:3px solid var(--warn);background:var(--warn-bg)}
.pvh input{width:40px;height:46px;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:1.4rem;font-weight:700;padding:0}
.pvh input:focus{outline:none;border-color:var(--primary);background:var(--n-bg)}
.pvh tr.carry input{width:34px;height:26px;font-size:.95rem;border-style:dashed;color:var(--bad)}
.c-tth{background:var(--tth)} .c-th{background:var(--th)} .c-h{background:var(--h)} .c-t{background:var(--t)} .c-u{background:var(--u)} .c-m{background:var(--m)} .c-hth{background:#b5179e}
.col-u{color:var(--u)} .col-t{color:var(--t)} .col-h{color:var(--h)} .col-th{color:var(--th)} .col-tth{color:var(--tth)}

/* Build tiles */
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;direction:ltr}
.tile{width:48px;height:52px;border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--line),var(--shadow);font-size:1.5rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:0;touch-action:none;user-select:none}
.tile.sel{outline:3px solid var(--primary)}
.tile.used{opacity:.25}
.slot{width:48px;height:52px;border-radius:12px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;background:#fff}
.slot.filled{border-style:solid;border-color:var(--primary)}

/* Geometry */
.shape-svg{width:100%;max-width:300px;height:auto;touch-action:none}
.corner{cursor:pointer}
.slider{width:100%;max-width:320px}

/* Explanations */
.explain{background:#fbfaf6;border-radius:14px;padding:12px;margin-top:8px;border-right:5px solid var(--warn)}

/* Summary */
.big-score{font-size:3rem;font-weight:700;text-align:center}
.starrow{font-size:2rem;text-align:center;letter-spacing:4px}

/* Teacher */
body.wide .card{padding:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{border:0;border-radius:12px;padding:10px 14px;background:#fff;box-shadow:var(--shadow);font-weight:500}
.tabs button.on{background:var(--ink);color:#fff}
.map{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff}
.map th,.map td{border:1px solid var(--line);padding:6px;text-align:center}
.map th{background:#faf8f4;position:sticky;top:0}
.map td.name{text-align:right;font-weight:500;white-space:nowrap;cursor:pointer;color:var(--primary)}
.cell-g{background:#d8f3e6}.cell-y{background:#fff1c7}.cell-r{background:#fbd9d6}.cell-n{background:#fff;color:#bbb}
.map-wrap{overflow:auto;max-height:70vh}
.slide{min-height:72vh;display:flex;flex-direction:column}
.slide .stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.slide h1{font-size:2.2rem}
.slide .lead{font-size:1.6rem;max-width:900px}
.slide .def{font-size:1.8rem;background:var(--warn-bg);border-radius:20px;padding:18px 26px;max-width:900px}
.proj .pvh td{font-size:2.2rem;height:64px;min-width:62px}
.proj .pvh th{font-size:1rem;min-width:62px}
.notes{background:#faf8f4;border-radius:14px;padding:12px 16px;font-size:.95rem}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.qr-card{background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow);break-inside:avoid}
.qr-card img,.qr-card canvas{width:180px;height:180px}
.report{max-width:760px;margin:0 auto;background:#fff;padding:26px;border-radius:16px}
.report table{border-collapse:collapse;width:100%}
.report td,.report th{border:1px solid var(--line);padding:6px 8px;text-align:right}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  #app{max-width:none;padding:0}
  .card,.qr-card,.report{box-shadow:none}
  .qr-card{border:1px solid #ccc}
}
@media (max-width:380px){ .roster{grid-template-columns:repeat(2,1fr)} .pvh td,.pvh input{min-width:34px;width:34px} }
.flag{font-size:.85em;cursor:help;white-space:nowrap}
.exvis svg{max-height:40vh;width:auto}
.exvis .options .opt svg{max-height:12vh}
</style>

</head>

<script>
/* ================= Core ================= */
var S = { token: null, student: null, progress: {}, lessonId: null };
var COMPANIONS = [
  { id: 'robot', face: '🤖', name: 'ביטי', ok: ['יופי! המעגלים שלי מהבהבים משמחה!', 'מדויק כמו מחשב!', 'בדיוק! ממשיכים?'], bad: ['לא נורא, גם לי יש באגים. בוא/י ננסה שוב.', 'כמעט! הנה רמז קטן.'] },
  { id: 'fox', face: '🦊', name: 'שועלי', ok: ['חכם/ה כמו שועל!', 'נכון! איזה כיף!', 'מצוין, ממשיכים בריצה!'], bad: ['אופס, קרה. בואו נבדוק שוב יחד.', 'עוד לא. יש לי רמז בשבילך.'] },
  { id: 'dragon', face: '🐲', name: 'דרקי', ok: ['פששש! אש של תשובה!', 'נכון! אני גאה בך!', 'וואו, כמו דרקון אמיתי!'], bad: ['לא מוותרים! נסו שוב.', 'כמעט. קחו רמז ונסו.'] }
];
var PHASE = { CHECK: 'בדיקה', PRACTICE: 'תרגול', CATCHUP: 'השלמה', REVIEW: 'חזרה', EXTRA: 'תרגול נוסף', EXPLORE: 'המחשה' };
var PLACE = [
  { s: 'י', n: 'יחידות', c: 'u' }, { s: 'ע', n: 'עשרות', c: 't' }, { s: 'מ', n: 'מאות', c: 'h' },
  { s: 'א', n: 'אלפים', c: 'th' }, { s: 'ע״א', n: 'עשרות אלפים', c: 'tth' }, { s: 'מ״א', n: 'מאות אלפים', c: 'hth' }, { s: 'מ׳', n: 'מיליונים', c: 'm' }
];

function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return Number(n).toLocaleString('en-US'); }
function N(n) { return '<span class="num">' + fmt(n) + '</span>'; }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function setApp(html) { $('#app').innerHTML = html; window.scrollTo(0, 0); }
function toast(msg, ms) { var t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add('hidden'); }, ms || 2600); }
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

function api(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (window.API_URL) { // page hosted outside Google: call the Apps Script endpoint anonymously
    return fetch(window.API_URL, { method: 'POST', body: JSON.stringify({ fn: name, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (o) { if (!o.ok) throw new Error(o.error || 'שגיאה'); return o.result; });
  }
  return new Promise(function (resolve, reject) {
    var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e && e.message ? e : new Error(String(e))); });
    runner[name].apply(runner, args);
  });
}
function errMsg(e) { return (e && e.message) ? e.message.replace(/^Error:\s*/, '') : 'משהו השתבש. נסו שוב.'; }

function companion() { var id = S.student && S.student.avatar; return COMPANIONS.filter(function (c) { return c.id === id; })[0] || COMPANIONS[0]; }
function buddyHtml(text, kind) {
  var c = companion();
  return '<div class="buddy ' + (kind || '') + '"><div class="avatar">' + c.face + '</div><div class="bubble">' + text + '</div></div>';
}
function topbar(extra) {
  var c = companion();
  return '<div class="topbar"><div class="avatar">' + c.face + '</div><div class="grow"><b>' + esc(S.student.name) + '</b><div class="small muted">' + esc(c.name) + ' איתך</div></div>' +
    '<span class="stars">⭐ ' + (S.student.stars || 0) + '</span>' + (extra || '') + '</div>';
}

/* ================= Start & login ================= */
function startApp() {
  if (BOOT.teacher || BOOT.set) { Teacher.start(); return; }
  S.lessonId = BOOT.lesson || null;
  S.subject = BOOT.subject || null;
  var token = load('math5_token');
  if (token) {
    api('api_resume', token).then(function (r) { onLoggedIn(r); }).catch(function () { store('math5_token', null); showRoster(); });
  } else showRoster();
}

function onLoggedIn(r) {
  S.token = r.token; S.student = r.student; S.progress = r.progress || {};
  store('math5_token', r.token);
  flushPending();
  route();
}

function activeLesson(id) { var l = lessonById(id); return l && l.active ? l : null; }
function route() {
  if (S.subject && !S.lessonId) {
    var subj = S.subject; S.subject = null;
    setApp('<div class="center-screen"><div class="spinner"></div><p>פותח את השיעור של היום…</p></div>');
    api('api_current').then(function (cur) {
      var id = cur && cur[subj];
      if (id && activeLesson(id)) { S.lessonId = id; showLesson(id); }
      else { showHome(); toast('המורה עוד לא בחר/ה את השיעור של היום. בחרו מהרשימה.', 3500); }
    }).catch(function () { showHome(); });
    return;
  }
  if (S.lessonId && activeLesson(S.lessonId)) showLesson(S.lessonId);
  else { if (S.lessonId) toast('השיעור הזה עוד לא מוכן'); S.lessonId = null; showHome(); }
}

function showRoster() {
  setApp('<div class="center-screen"><div class="spinner"></div></div>');
  api('api_roster').then(function (list) {
    var html = '<h1>שלום! מי את/ה?</h1><p class="muted">בחרו את השם שלכם</p><div class="roster">' +
      list.map(function (s) { return '<button data-id="' + s.id + '" data-pin="' + (s.hasPin ? 1 : 0) + '">' + esc(s.name) + '</button>'; }).join('') +
      '</div><p style="text-align:center;margin-top:30px"><button class="linkbtn small" id="tmode">מצב מורה</button></p>';
    setApp(html);
    $all('.roster button').forEach(function (b) {
      b.onclick = function () { loginFlow(b.getAttribute('data-id'), b.textContent, b.getAttribute('data-pin') === '1'); };
    });
    $('#tmode').onclick = function () { Teacher.start(); };
  }).catch(function (e) { setApp('<div class="center-screen"><p>' + esc(errMsg(e)) + '</p><button class="btn" onclick="showRoster()">נסו שוב</button></div>'); });
}

function pinScreen(title, sub, onDone, onBack) {
  var pin = '';
  setApp('<h1 style="text-align:center">' + title + '</h1><p class="muted" style="text-align:center">' + (sub || '') + '</p>' +
    '<div class="pindots"><span></span><span></span><span></span></div><div class="pinpad">' +
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (d) { return '<button data-d="' + d + '">' + d + '</button>'; }).join('') +
    '<button data-d="back">⌫</button><button data-d="0">0</button><button data-d="x" class="small">חזרה</button></div>');
  function draw() { $all('.pindots span').forEach(function (s, i) { s.classList.toggle('f', i < pin.length); }); }
  $all('.pinpad button').forEach(function (b) {
    b.onclick = function () {
      var d = b.getAttribute('data-d');
      if (d === 'back') pin = pin.slice(0, -1);
      else if (d === 'x') { (onBack || showRoster)(); return; }
      else if (pin.length < 3) pin += d;
      draw();
      if (pin.length === 3) setTimeout(function () { onDone(pin); }, 150);
    };
  });
}

function loginFlow(id, name, hasPin) {
  if (hasPin) {
    pinScreen('שלום ' + esc(name) + '!', 'הקלידו את הקוד הסודי שלכם', function (pin) {
      setApp('<div class="center-screen"><div class="spinner"></div></div>');
      api('api_login', id, pin, '').then(onLoggedIn).catch(function (e) { toast(errMsg(e), 3500); loginFlow(id, name, true); });
    });
  } else {
    pinScreen('בחרו קוד סודי', 'שלוש ספרות שרק אתם יודעים', function (pin1) {
      pinScreen('הקלידו שוב את הקוד', 'כדי לוודא שזכרתם', function (pin2) {
        if (pin1 !== pin2) { toast('הקודים לא זהים. ננסה שוב.'); loginFlow(id, name, false); return; }
        chooseCompanion(function (avatar) {
          setApp('<div class="center-screen"><div class="spinner"></div></div>');
          api('api_login', id, pin1, avatar).then(onLoggedIn).catch(function (e) { toast(errMsg(e), 3500); showRoster(); });
        });
      });
    });
  }
}

function chooseCompanion(cb) {
  var sel = null;
  setApp('<h1>מי ילווה אתכם?</h1><p class="muted">בחרו חבר/ה לדרך. אפשר להחליף אחר כך.</p><div class="companions">' +
    COMPANIONS.map(function (c) { return '<button data-c="' + c.id + '"><span class="face">' + c.face + '</span>' + c.name + '</button>'; }).join('') +

function logout() { store('math5_token', null); S.token = null; S.student = null; showRoster(); }

/* ================= Home & lesson ================= */
function lessonById(id) { return LESSONS.filter(function (l) { return l.id === id; })[0]; }
function trackLessons(track) { return LESSONS.filter(function (l) { return l.track === track && !l.review; }).sort(function (a, b) { return a.order - b.order; }); }
function lessonDone(id) { var p = S.progress[id]; return !!(p && (p[PHASE.PRACTICE] || p[PHASE.CATCHUP])); }
function lessonScore(id) { var p = S.progress[id]; if (!p) return null; var x = p[PHASE.PRACTICE] || p[PHASE.CATCHUP]; return x ? x.score : null; }
function missedBefore(L) {
  return trackLessons(L.track).filter(function (x) { return x.active && x.order < L.order && !lessonDone(x.id); });
}
function trackName(t) { return t === 'N' ? 'מספרים טבעיים' : 'גאומטריה'; }
function trackPill(t) { return '<span class="pill ' + (t === 'G' ? 'g' : '') + '">' + trackName(t) + '</span>'; }

function showHome() {
  var html = topbar('<button class="btn ghost small" onclick="logout()">לא אני</button>');
  html += '<h2>השיעורים שלי</h2>';
  ['N', 'G'].forEach(function (t) {
    html += '<div class="card track-' + t.toLowerCase() + '"><h3>' + trackName(t) + '</h3><div class="lesson-list">';
    trackLessons(t).filter(function (l) { return l.active; }).forEach(function (l) {
      var sc = lessonScore(l.id);
      html += '<button data-l="' + l.id + '"><span class="grow"><b>' + esc(l.title) + '</b><br><span class="small muted">' + esc(l.day) + ' · עמ׳ ' + esc(l.pages) + '</span></span>' +
        (sc == null ? '<span class="pill">חדש</span>' : '<span class="pill ' + scoreClass(sc) + '">✓ ' + sc + '%</span>') + '</button>';
    });
    html += '</div></div>';
  });
  setApp(html);
  $all('.lesson-list button').forEach(function (b) { b.onclick = function () { S.lessonId = b.getAttribute('data-l'); showLesson(S.lessonId); }; });
}
function scoreClass(sc) { return sc >= 80 ? 'ok' : sc >= 60 ? 'warn' : 'bad'; }

function showLesson(id) {
  var L = lessonById(id);
  var missed = missedBefore(L);
  var prog = S.progress[id] || {};
  var html = topbar('<button class="btn ghost small" onclick="S.lessonId=null;showHome()">שיעורים</button>');
  html += '<div class="card track-' + L.track.toLowerCase() + '">' + trackPill(L.track) + '<h1>' + esc(L.title) + '</h1><div class="small muted">' + esc(L.day) + ' · עמ׳ ' + esc(L.pages) + ' בחוברת</div></div>';
  if (missed.length && !S.skipMissed) {
    var m = missed[0];
    html += '<div class="card"><h3>📌 קודם נשלים שיעור שפספסת</h3><p><b>' + esc(m.title) + '</b> (עמ׳ ' + esc(m.pages) + ')</p>' +
      '<button class="btn block warn" id="catch">נשלים עכשיו</button><p style="text-align:center"><button class="linkbtn small" id="skipm">המורה ביקש/ה לדלג בינתיים</button></p></div>';
  }
  var prev = L.prev ? lessonById(L.prev) : null;
  var checkDone = !!prog[PHASE.CHECK];
  var practiceDone = !!prog[PHASE.PRACTICE];
  html += '<div class="card steps">';
  var n = 1;
  if (prev) {
    html += '<div class="step ' + (checkDone ? 'done' : 'now') + '"><div class="dot">' + (checkDone ? '✓' : n) + '</div><div class="grow"><b>בדיקת פתיחה</b><div class="small muted">5 שאלות על: ' + esc(prev.title) + '</div></div>' +
      (checkDone ? '<span class="pill ' + scoreClass(prog[PHASE.CHECK].score) + '">' + prog[PHASE.CHECK].score + '%</span>' : '<button class="btn small" id="check">התחלה</button>') + '</div>';
    n++;
  }
  html += '<div class="step ' + (checkDone || !prev ? 'now' : '') + '"><div class="dot">' + n + '</div><div class="grow"><b>המורה מסביר/ה</b><div class="small muted">הקשיבו להסבר על הלוח</div></div></div>';
  n++;
  var exploreDone = !L.explore || !!prog[PHASE.EXPLORE] || !!prog[PHASE.CATCHUP] || practiceDone;
  if (L.explore) {
    html += '<div class="step ' + (exploreDone ? 'done' : 'now') + '"><div class="dot">' + (exploreDone ? '✓' : n) + '</div><div class="grow"><b>המחשה בטלפון 👀</b><div class="small muted">' + L.explore.length + ' מסכים, כ-4 דקות: מזיזים, מגלים, עונים</div></div>' +
      '<button class="btn small' + (exploreDone ? ' ghost' : '') + '" id="explore">' + (exploreDone ? 'שוב' : 'התחלה') + '</button></div>';
    n++;
  }
  html += '<div class="step ' + (practiceDone ? 'done' : '') + '"><div class="dot">' + (practiceDone ? '✓' : n) + '</div><div class="grow"><b>תרגול</b><div class="small muted">' + (exploreDone ? 'כ-15 שאלות עם רמזים' : 'נפתח אחרי ההמחשה') + '</div></div>' +
    (practiceDone ? '<span class="pill ' + scoreClass(prog[PHASE.PRACTICE].score) + '">' + prog[PHASE.PRACTICE].score + '%</span>' : '<button class="btn small ok" id="practice"' + (exploreDone ? '' : ' disabled') + '>לתרגול</button>') + '</div>';
  html += '</div>';
  if (practiceDone) {
    html += '<button class="btn block ghost" id="extra">עוד תרגול (רשות)</button>';
  }
  setApp(html);
  if ($('#catch')) $('#catch').onclick = function () { catchUp(missed[0], L); };
  if ($('#skipm')) $('#skipm').onclick = function () { S.skipMissed = true; showLesson(id); };
  if ($('#check')) $('#check').onclick = function () { runQuiz({ lesson: L, gen: prev, phase: PHASE.CHECK, n: 5, hints: false }); };
  function practice() { runQuiz({ lesson: L, gen: L, phase: PHASE.PRACTICE, n: L.practiceN || 15, hints: true, adaptive: true }); }
  if ($('#explore')) $('#explore').onclick = function () { runExplore(L, { after: practiceDone ? function () { showLesson(id); } : practice }); };
  if ($('#practice')) $('#practice').onclick = function () { if (!exploreDone) { toast('קודם ההמחשה 👀'); return; } practice(); };
  if ($('#extra')) $('#extra').onclick = function () { runQuiz({ lesson: L, gen: L, phase: PHASE.EXTRA, n: 8, hints: true, adaptive: true }); };
}

function catchUp(M, backTo) {
  var html = topbar() + '<div class="card track-' + M.track.toLowerCase() + '">' + trackPill(M.track) + '<h2>השלמה: ' + esc(M.title) + '</h2>' +
    '<p class="muted small">קראו, נסו את ההמחשה, ואז נתרגל.</p></div>';

  html += '<div class="card"><h3>🤔 שאלה לפתיחה</h3><div>' + I.question + '</div></div>';
  html += '<div class="card"><h3>👀 המחשה</h3><div id="catchvis"></div></div>';
  html += '<div class="card"><h3>📘 מה חשוב לזכור</h3><div>' + I.definition + '</div></div>';
  html += '<div class="card"><h3>✏️ דוגמה פתורה</h3><div>' + I.example + '</div></div>';
  html += '<button class="btn block ok" id="go">' + (M.explore ? 'להמחשה ואז לתרגול' : 'לתרגול') + '</button>';

  I.visual($('#catchvis'), { student: true });
  function practice() { runQuiz({ lesson: M, gen: M, phase: PHASE.CATCHUP, n: 12, hints: true, adaptive: true, after: function () { S.lessonId = backTo.id; showLesson(backTo.id); } }); }
  $('#go').onclick = function () { if (M.explore) runExplore(M, { after: practice }); else practice(); };
}

/* ================= Explore (המחשה) – interactive screens before practice ================= */
function runExplore(L, opt) {
  var screens = L.explore, k = 0, attempts = [], correct = 0;
  function show() {
    var sc = screens[k], q = sc.q, tries = 0, solved = false;
    var html = topbar() + '<div class="spread small muted"><span>👀 המחשה · ' + esc(L.title) + '</span><span>' + (k + 1) + '/' + screens.length + '</span></div>' +
      '<div class="progress"><div style="width:' + Math.round(k * 100 / screens.length) + '%"></div></div>' +
      '<div class="card"><h2 style="margin:0 0 4px">' + esc(sc.title) + '</h2><p class="muted" style="margin:0 0 8px">' + sc.text + '</p><div id="exvis"></div></div>' +
      '<div class="card"><div class="prompt">' + q.prompt + '</div><div id="exq"></div><div id="exfb" class="feedback"></div></div>' +
      '<button class="btn block ok" id="exnext" disabled>' + (k < screens.length - 1 ? 'הבא ←' : 'סיום ההמחשה ✓') + '</button>';
    setApp(html);
    sc.vis($('#exvis'), { student: true });
    var qel = $('#exq');
    function done(ok) {
      if (solved) return; solved = true;
      if (ok && tries === 1) correct++;
      attempts.push({ item: L.id + '-ex' + (k + 1), skill: 'המחשה: ' + sc.title, ok: ok && tries === 1, err: '', hints: tries > 1 ? 1 : 0, level: 0, answer: '' });
      $('#exnext').disabled = false;
      setTimeout(function () { var b = $('#exnext'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 60);
    }
    if (q.options) {
      qel.innerHTML = '<div class="options">' + q.options.map(function (o, i) { return '<button class="opt" data-i="' + i + '">' + o[0] + '</button>'; }).join('') + '</div>';
      $all('.opt', qel).forEach(function (b) {
        b.onclick = function () {
          if (solved || b.disabled) return;
          var o = q.options[Number(b.getAttribute('data-i'))]; tries++;
          if (o[1]) { b.classList.add('right'); $('#exfb').innerHTML = buddyHtml(o[2], 'ok'); done(true); $all('.opt', qel).forEach(function (x) { x.disabled = true; }); }
          else {
            b.classList.add('wrong'); b.disabled = true; $('#exfb').innerHTML = buddyHtml(o[2], 'bad');
            if (tries >= 2) { q.options.forEach(function (oo, i) { if (oo[1]) $all('.opt', qel)[i].classList.add('right'); }); done(false); }
          }
        };
      });
    } else {
      qel.innerHTML = '<div style="text-align:center"><input class="answer-input" inputmode="numeric" autocomplete="off" placeholder="?">' + (q.unit ? ' <span>' + q.unit + '</span>' : '') + '</div><button class="btn block" id="excheck" style="margin-top:8px">בדיקה</button>';
      var inp = $('input', qel);
      inp.onkeydown = function (e) { if (e.key === 'Enter') $('#excheck').click(); };
      $('#excheck').onclick = function () {
        if (solved) return;
        var v = Number(inp.value.replace(/[,\s]/g, ''));
        if (inp.value.trim() === '' || isNaN(v)) { toast('עוד לא ענית 🙂'); return; }
        tries++;
        if (v === q.num) { $('#exfb').innerHTML = buddyHtml(q.okText, 'ok'); inp.disabled = true; $('#excheck').disabled = true; done(true); }
        else if (tries >= 2) { $('#exfb').innerHTML = buddyHtml('התשובה: <b>' + fmt(q.num) + '</b>. ' + q.okText.replace(/^נכון!\s*/, ''), 'bad'); inp.disabled = true; $('#excheck').disabled = true; done(false); }
        else { $('#exfb').innerHTML = buddyHtml(q.badText, 'bad'); inp.select(); }
      };
    }
    $('#exnext').onclick = function () { if (k < screens.length - 1) { k++; show(); } else finish(); };
  }
  function finish() {
    var summary = { lesson: L.id, phase: PHASE.EXPLORE, correct: correct, total: screens.length, stars: 1, level: 0, attempts: attempts };
    var p = S.progress[L.id] = S.progress[L.id] || {};
    p[PHASE.EXPLORE] = { score: Math.round(correct * 100 / screens.length), level: 0 };
    saveResult(summary);
    var c = companion();
    setApp(topbar() + '<div class="card" style="text-align:center"><div style="font-size:3rem">' + c.face + '</div><h2>סיימתם את ההמחשה!</h2><p>' + correct + ' מתוך ' + screens.length + ' בניסיון הראשון · ⭐ 1</p><p class="muted">עכשיו מתרגלים – עם רמזים כשצריך.</p></div>' +
      '<button class="btn block ok" id="exgo">לתרגול ←</button>');
    $('#exgo').onclick = function () { if (opt && opt.after) opt.after(); else showLesson(L.id); };
  }
  show();
}

/* ================= Quiz runner ================= */
function startLevelFor(L) {
  var t = Number(S.student.level || 0);
  if (t >= 1 && t <= 3) return t;
  var best = 0, bestLevel = 2;
  Object.keys(S.progress).forEach(function (k) {
    var l = lessonById(k); if (!l || l.track !== L.track) return;
    var p = S.progress[k][PHASE.PRACTICE];
    if (p && p.level && l.order >= best) { best = l.order; bestLevel = p.level; }
  });
  return Math.max(1, Math.min(3, bestLevel || 2));
}

/* ---------- Screen-leave watcher (a sign to check, not proof) ---------- */
var W = { active: false, leaves: 0, awayMs: 0, since: 0, start: 0, firstAt: 0, awayAtFirst: 0, onBack: null };
function wReset() { W.active = true; W.leaves = 0; W.awayMs = 0; W.since = 0; W.start = Date.now(); W.firstAt = 0; W.awayAtFirst = 0; }
function wGone() { if (W.active && !W.since) W.since = Date.now(); }
function wBack() {
  if (!W.since) return;
  var d = Date.now() - W.since; W.since = 0;
  if (!W.active || d < 2000) return; // ignore flickers (notifications, keyboard)
  W.leaves++; W.awayMs += d;
  toast('👀 שמתי לב שיצאת מהמסך. נסו לפתור לבד, ככה המוח מתאמן 💪', 4000);
}
document.addEventListener('visibilitychange', function () { if (document.hidden) wGone(); else wBack(); });
window.addEventListener('blur', wGone);
window.addEventListener('focus', wBack);
window.addEventListener('pageshow', wBack);
function wFirstSubmit() { if (!W.firstAt) { W.firstAt = Date.now(); W.awayAtFirst = W.awayMs; } }
function wSnapshot() {
  wBack();
  var end = W.firstAt || Date.now(), away = W.firstAt ? W.awayAtFirst : W.awayMs;
  var r = { leaves: W.leaves, away: Math.round(W.awayMs / 1000), secs: Math.max(0, Math.round((end - W.start - away) / 100) / 10) };
  W.active = false;
  return r;
}
var FAST_TYPES = { num: 1, column: 1, blanks: 1, build: 1 };
function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }

function runQuiz(opt) {
  var st = { i: 0, level: startLevelFor(opt.lesson), okRun: 0, badRun: 0, correct: 0, attempts: [], bonus: 0, seen: {}, levelUps: 0, times: [] };
  var total = opt.n;
  next();

  function next() {
    if (st.i >= total) return finish();
    var item = null;
    for (var tries = 0; tries < 8; tries++) {
      item = opt.gen.gen(st.level, st.i);
      if (!st.seen[item.key]) break;
    }
    st.seen[item.key] = 1;
    showItem(item);
  }

  function showItem(item) {
    var title = opt.phase === PHASE.CHECK ? 'בדיקת פתיחה' : opt.phase;
    var html = topbar() + '<div class="spread small muted"><span>' + esc(title) + ' · ' + esc(opt.lesson.title) + '</span><span>' + (st.i + 1) + '/' + total + '</span></div>' +
      '<div class="progress"><div style="width:' + Math.round(st.i * 100 / total) + '%"></div></div>' +
      (opt.adaptive ? '<div class="small muted">רמה ' + st.level + ' ' + '●'.repeat(st.level) + '○'.repeat(3 - st.level) + '</div>' : '') +
      '<div class="card" id="itemcard"><div class="prompt">' + item.prompt + '</div><div id="itembody"></div><div id="itemfeedback" class="feedback"></div></div>' +
      '<div id="itemactions"></div>';
    setApp(html);
    var ui = ITEM_TYPES[item.type](item, $('#itembody'));
    window.__item = item;
    wReset();
    var tries = 0, hints = 0, firstErr = '', firstAns = '';
    var actions = $('#itemactions');
    actions.innerHTML = '<button class="btn block" id="submit">בדיקה</button>';
    $('#submit').onclick = submit;

    function submit() {
      var ans = ui.get();
      if (ans === null || ans === undefined || ans === '') { toast('עוד לא ענית 🙂'); return; }
      var res = item.check(ans);
      tries++;
      if (tries === 1) wFirstSubmit();
      if (tries === 1) { firstAns = ans; firstErr = res.ok ? '' : (res.err || 'calc'); }
      if (opt.phase === PHASE.CHECK || !opt.hints) {
        record(item, res.ok && tries === 1, firstErr, 0, firstAns);
        st.i++; next(); return;
      }
      if (res.ok) {
        ui.lock && ui.lock(true);
        if (tries > 1 && tries <= 3) st.bonus = Math.min(4, st.bonus + 1);
        var c = companion();
        $('#itemfeedback').innerHTML = buddyHtml(pick(c.ok) + (item.praise ? '<br><span class="small">' + item.praise + '</span>' : ''), 'ok');
        done(tries === 1 && hints === 0);
        return;
      }
      if (tries === 1) {
        hints = 1;
        $('#itemfeedback').innerHTML = buddyHtml(pick(companion().bad) + '<br><b>רמז:</b> ' + hintFor(item, res.err), 'bad');
        ui.retry && ui.retry();
      } else if (tries === 2) {
        hints = 2;
        $('#itemfeedback').innerHTML = buddyHtml('בואו נראה את זה יחד, שלב אחר שלב:', 'bad') + '<div class="explain">' + (item.explain ? item.explain() : '') + '</div>';
        ui.retry && ui.retry();
      } else {
        ui.lock && ui.lock(true);
        ui.reveal && ui.reveal();
        $('#itemfeedback').innerHTML = buddyHtml('התשובה הנכונה: <b>' + item.answerText + '</b>. בפעם הבאה זה יצליח!', 'bad') + (item.explain && hints < 2 ? '<div class="explain">' + item.explain() + '</div>' : '');
        done(false);
      }
    }
    function done(firstTryOk) {
      record(item, firstTryOk, firstErr, hints, firstAns);
      if (opt.adaptive) adapt(firstTryOk);
      actions.innerHTML = '<button class="btn block ok" id="next">הבא ←</button>';
      $('#next').onclick = function () { st.i++; next(); };
      setTimeout(function () { var n = $('#next'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 60);
    }
  }

  function hintFor(item, err) {
    if (item.hintByErr && err && item.hintByErr[err]) return item.hintByErr[err];
    return item.hint || 'קראו שוב את השאלה ובדקו כל שלב.';
  }

  function record(item, ok, err, hints, ans) {
    if (ok) st.correct++;
    var w = wSnapshot(), fast = false;
    if (FAST_TYPES[item.type]) {
      // secondary sign: correct, first try, much quicker than this child's own pace today
      if (ok && !w.leaves && st.times.length >= 3 && w.secs < 8 && w.secs < 0.4 * median(st.times)) fast = true;
      st.times.push(w.secs);
    }
    st.attempts.push({ item: item.key, skill: item.skill || '', ok: ok, err: ok ? '' : err, hints: hints, level: st.level, answer: Array.isArray(ans) ? ans.join('|') : ans,
      leaves: w.leaves, away: w.away, secs: w.secs, fast: fast });
  }

  function adapt(ok) {
    if (ok) { st.okRun++; st.badRun = 0; } else { st.badRun++; st.okRun = 0; }
    if (st.okRun >= 3 && st.level < 3) { st.level++; st.okRun = 0; st.levelUps++; toast('⬆️ עולים לרמה ' + st.level + '!'); }
    if (st.badRun >= 2 && st.level > 1) { st.level--; st.badRun = 0; toast('נתרגל קצת ברמה ' + st.level); }
  }

  function finish() {
    var pct = Math.round(st.correct * 100 / total);
    var stars = 0;
    if (opt.phase === PHASE.CHECK) {
      stars = 1;
      var prevCheck = lastCheckScore(opt.lesson);
      if (prevCheck != null && pct > prevCheck) stars += 2;
    } else {
      // effort (finishing + fixing after a hint) and success (first-try answers, level-ups) both count
      stars = 3 + Math.min(3, Math.floor(st.correct / 4)) + Math.min(2, st.bonus) + Math.min(2, st.levelUps);
    }
    var errs = {};
    st.attempts.forEach(function (a) { if (a.err) errs[a.err] = (errs[a.err] || 0) + 1; });
    var summary = { lesson: opt.lesson.id, phase: opt.phase, correct: st.correct, total: total, stars: stars, level: st.level, attempts: st.attempts };
    showSummary(opt, pct, stars, errs, st);
    saveResult(summary);
  }
}

function lastCheckScore(L) {
  var best = null, bestOrder = -1;
  Object.keys(S.progress).forEach(function (k) {
    var l = lessonById(k); if (!l || l.track !== L.track || l.id === L.id) return;
    var c = S.progress[k][PHASE.CHECK];
    if (c && l.order > bestOrder) { bestOrder = l.order; best = c.score; }
  });
  return best;
}

function showSummary(opt, pct, stars, errs, st) {
  var c = companion();
  var msg = pct >= 80 ? 'כל הכבוד! שולטים בזה.' : pct >= 60 ? 'יפה מאוד! עוד קצת תרגול וזה שלכם.' : 'עבדתם קשה, וזה מה שחשוב. נמשיך לתרגל יחד.';
  var html = topbar() + '<div class="card" style="text-align:center"><h2>' + (opt.phase === PHASE.CHECK ? 'סיימתם את בדיקת הפתיחה' : 'סיימתם!') + '</h2>' +
    '<div class="big-score">' + pct + '%</div><div class="muted">' + st.correct + ' מתוך ' + st.attempts.length + ' נכונות בניסיון הראשון</div>' +
    '<div class="starrow">' + '⭐'.repeat(Math.min(stars, 10)) + '</div><div class="small muted">+' + stars + ' כוכבים על המאמץ וההצלחה</div></div>';
  html += buddyHtml(msg, pct >= 60 ? 'ok' : '');
  if (opt.phase === PHASE.CHECK) {
    html += '<div class="card"><h3>התשובות שלך</h3>' + st.attempts.map(function (a, i) { return '<div>' + (i + 1) + '. ' + (a.ok ? '✅ נכון' : '❌ לא נכון') + '</div>'; }).join('') + '</div>';
  }
  var keys = Object.keys(errs).sort(function (a, b) { return errs[b] - errs[a]; });
  var reviewLesson = null;
  if (keys.length && opt.phase !== PHASE.CHECK) {
    html += '<div class="card"><h3>כדאי לחזק</h3>' + keys.slice(0, 2).map(function (k) { return '<div>• ' + esc(errLabel(k)) + '</div>'; }).join('') + '</div>';
    keys.forEach(function (k) { var r = ERR[k] && ERR[k].review; if (!reviewLesson && r && errs[k] >= 2) reviewLesson = lessonById(r); });
  }
  if (reviewLesson) html += '<button class="btn block warn" id="review">תרגול חזרה קצר: ' + esc(reviewLesson.title) + '</button><p></p>';
  html += '<button class="btn block" id="back">המשך</button>';
  setApp(html);
  if ($('#review')) $('#review').onclick = function () { runQuiz({ lesson: reviewLesson, gen: reviewLesson, phase: PHASE.REVIEW, n: 6, hints: true, adaptive: true, after: function () { showLesson(opt.lesson.id); } }); };
  $('#back').onclick = function () { if (opt.after) opt.after(); else showLesson(opt.lesson.id); };
}

function errLabel(k) { return (ERR[k] && ERR[k].label) || k; }

function saveResult(summary) {
  api('api_saveResult', S.token, summary).then(function (r) {
    S.student.stars = r.stars; S.progress = r.progress;
    var sb = $('.stars'); if (sb) sb.textContent = '⭐ ' + r.stars;
  }).catch(function () {
    var q = load('math5_pending') || []; q.push(summary); store('math5_pending', q);
    var p = S.progress[summary.lesson] = S.progress[summary.lesson] || {};
    p[summary.phase] = { score: Math.round(summary.correct * 100 / summary.total), level: summary.level };
    toast('אין חיבור כרגע – נשמור ברגע שיחזור האינטרנט', 3500);
  });
}
function flushPending() {
  var q = load('math5_pending') || [];
  if (!q.length) return;
  store('math5_pending', []);
  q.forEach(function (s) { saveResult(s); });
}

/* ================= Item types ================= */
var ITEM_TYPES = {};

ITEM_TYPES.num = function (item, el) {
  el.innerHTML = (item.visual || '') + '<div style="text-align:center"><input class="answer-input" inputmode="numeric" autocomplete="off" placeholder="?">' + (item.unit ? ' <span>' + item.unit + '</span>' : '') + '</div>';
  var inp = $('input', el);
  setTimeout(function () { inp.focus(); }, 50);
  inp.onkeydown = function (e) { if (e.key === 'Enter') { var b = $('#submit'); if (b) b.click(); } };
  return {
    get: function () { var v = inp.value.replace(/[,\s]/g, ''); return v === '' ? '' : (/^\d+$/.test(v) ? Number(v) : NaN); },
    retry: function () { inp.select(); },
    lock: function () { inp.disabled = true; },
    reveal: function () { inp.value = item.answerText.replace(/<[^>]+>/g, ''); }
  };
};

/* Column addition in the place-value house */
ITEM_TYPES.column = function (item, el) {
  var rows = item.rows, result = item.result;
  var cols = Math.max(String(result).length, Math.max.apply(null, rows.map(function (r) { return String(r).length; })));
  var head = '<tr><td class="op"></td>';
  for (var c = cols - 1; c >= 0; c--) head += '<th class="c-' + PLACE[c].c + '" title="' + PLACE[c].n + '">' + PLACE[c].s + '</th>';
  head += '</tr>';
  var carry = '<tr class="carry"><td class="op"></td>';
  for (c = cols - 1; c >= 0; c--) carry += '<td>' + (c > 0 ? '<input data-carry="' + c + '" inputmode="numeric" maxlength="1">' : '') + '</td>';
  carry += '</tr>';
  var body = rows.map(function (r, ri) {
    var s = String(r), tr = '<tr><td class="op">' + (ri === rows.length - 1 ? '+' : '') + '</td>';
    for (var c = cols - 1; c >= 0; c--) { var d = c < s.length ? s[s.length - 1 - c] : ''; tr += '<td class="col-' + PLACE[c].c + '">' + d + '</td>'; }
    return tr + '</tr>';
  }).join('');
  var sum = '<tr class="sum"><td class="op">=</td>';
  for (c = cols - 1; c >= 0; c--) sum += '<td><input data-col="' + c + '" inputmode="numeric" maxlength="2"></td>';
  sum += '</tr>';
  el.innerHTML = (item.visual || '') + '<div style="overflow-x:auto"><table class="pvh">' + head + carry + body + sum + '</table></div>' +
    '<p class="small muted" style="text-align:center">מתחילים מהיחידות (מימין). את מה שמעבירים כותבים בשורה העליונה הקטנה.</p>';
  var inputs = $all('input[data-col]', el);
  function byCol(c) { return $('input[data-col="' + c + '"]', el); }
  inputs.forEach(function (inp) {
    inp.oninput = function () {
      inp.value = inp.value.replace(/\D/g, '').slice(-1);
      var c = Number(inp.getAttribute('data-col'));
      if (inp.value && byCol(c + 1)) byCol(c + 1).focus();
    };
    inp.onkeydown = function (e) {
      var c = Number(inp.getAttribute('data-col'));
      if (e.key === 'Backspace' && !inp.value && byCol(c - 1)) { byCol(c - 1).focus(); }
      if (e.key === 'Enter') { var b = $('#submit'); if (b) b.click(); }
    };
  });
  $all('input[data-carry]', el).forEach(function (inp) { inp.oninput = function () { inp.value = inp.value.replace(/\D/g, '').slice(-1); }; });
  setTimeout(function () { var u = byCol(0); if (u) u.focus(); }, 50);
  return {
    get: function () {
      var digits = '';
      for (var c = cols - 1; c >= 0; c--) digits += (byCol(c).value || ' ');
      digits = digits.replace(/^\s+/, '');
      if (!digits || /\s/.test(digits)) return digits.trim() === '' ? '' : NaN;
      return Number(digits);
    },
    retry: function () { var u = byCol(0); if (u) u.focus(); },
    lock: function () { $all('input', el).forEach(function (i) { i.disabled = true; }); },
    reveal: function () { var s = String(result); for (var c = 0; c < cols; c++) { var inp = byCol(c); if (inp) inp.value = c < s.length ? s[s.length - 1 - c] : ''; } }
  };
};

ITEM_TYPES.mc = function (item, el) {
  var sel = null;
  var cls = item.layout === 'two' ? 'two' : item.layout === 'three' ? 'three' : '';
  el.innerHTML = (item.visual || '') + '<div class="options ' + cls + '">' + item.options.map(function (o, i) { return '<button class="opt" data-i="' + i + '">' + o.html + '</button>'; }).join('') + '</div>';
  var btns = $all('.opt', el);
  btns.forEach(function (b) { b.onclick = function () { if (b.disabled) return; btns.forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); sel = Number(b.getAttribute('data-i')); }; });
  return {
    get: function () { return sel === null ? '' : sel; },
    retry: function () { if (sel !== null) { btns[sel].classList.add('wrong'); btns[sel].disabled = true; btns[sel].classList.remove('sel'); sel = null; } },
    lock: function () { btns.forEach(function (b) { b.disabled = true; }); },
    reveal: function () { item.options.forEach(function (o, i) { if (o.correct) btns[i].classList.add('right'); }); }
  };
};
function mcCheck(item) {
  return function (i) { var o = item.options[i]; return o.correct ? { ok: true } : { ok: false, err: o.err || 'calc' }; };
}

ITEM_TYPES.multi = function (item, el) {
  var on = {};
  el.innerHTML = (item.visual || '') + '<p class="small muted">אפשר לבחור יותר מאחד</p><div class="options ' + (item.layout || 'three') + '">' + item.options.map(function (o, i) { return '<button class="opt" data-i="' + i + '">' + o.html + '</button>'; }).join('') + '</div>';
  var btns = $all('.opt', el);
  btns.forEach(function (b) { b.onclick = function () { if (b.disabled) return; var i = Number(b.getAttribute('data-i')); on[i] = !on[i]; b.classList.toggle('sel', !!on[i]); }; });
  return {
    get: function () { var a = Object.keys(on).filter(function (k) { return on[k]; }).map(Number).sort(); return a.length ? a : ''; },
    retry: function () { },
    lock: function () { btns.forEach(function (b) { b.disabled = true; }); },
    reveal: function () { item.options.forEach(function (o, i) { btns[i].classList.remove('sel'); btns[i].classList.add(o.correct ? 'right' : 'wrong'); }); }
  };
};
function multiCheck(item) {
  return function (sel) {
    var errs = [];
    item.options.forEach(function (o, i) {
      var picked = sel.indexOf(i) >= 0;
      if (o.correct && !picked) errs.push(o.errMissed || 'missed');
      if (!o.correct && picked) errs.push(o.errPicked || 'wrong_pick');
    });
    return errs.length ? { ok: false, err: errs[0] } : { ok: true };
  };
}

/* Drag (or tap) digit tiles into the place-value house */
ITEM_TYPES.build = function (item, el) {
  var cols = item.cols, digits = item.tiles;
  var slots = [];
  var html = (item.visual || '') + '<table class="pvh"><tr>';
  for (var c = cols - 1; c >= 0; c--) html += '<th class="c-' + PLACE[c].c + '">' + PLACE[c].s + '</th>';
  html += '</tr><tr>';
  for (c = cols - 1; c >= 0; c--) html += '<td style="background:none"><div class="slot" data-c="' + c + '"></div></td>';
  html += '</tr></table><div class="tiles">' + digits.map(function (d, i) { return '<button class="tile" data-t="' + i + '">' + d + '</button>'; }).join('') + '</div>' +
    '<p style="text-align:center"><button class="linkbtn small" id="clr">ניקוי</button></p><p class="small muted" style="text-align:center">גררו כל ספרה למקום שלה, או הקישו על ספרה ואז על משבצת.</p>';
  el.innerHTML = html;
  var selTile = null, fill = {};
  var tiles = $all('.tile', el), slotEls = $all('.slot', el);
  function place(ti, slot) {
    var c = slot.getAttribute('data-c');
    if (fill[c] != null) tiles[fill[c]].classList.remove('used');
    Object.keys(fill).forEach(function (k) { if (fill[k] === ti) { delete fill[k]; $('.slot[data-c="' + k + '"]', el).textContent = ''; $('.slot[data-c="' + k + '"]', el).classList.remove('filled'); } });
    fill[c] = ti; slot.textContent = digits[ti]; slot.classList.add('filled'); tiles[ti].classList.add('used'); tiles[ti].classList.remove('sel'); selTile = null;
  }
  tiles.forEach(function (t, i) {
    t.onclick = function () { if (t.classList.contains('used')) return; tiles.forEach(function (x) { x.classList.remove('sel'); }); t.classList.add('sel'); selTile = i; };
    t.onpointerdown = function (e) {
      if (t.classList.contains('used')) return;
      var ghost = t.cloneNode(true); ghost.style.position = 'fixed'; ghost.style.pointerEvents = 'none'; ghost.style.zIndex = 40; ghost.style.opacity = .85;
      var moved = false;
      function mv(ev) { moved = true; if (!ghost.parentNode) document.body.appendChild(ghost); ghost.style.left = (ev.clientX - 24) + 'px'; ghost.style.top = (ev.clientY - 26) + 'px'; }
      function up(ev) {
        document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
        if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
        if (!moved) return;
        var target = document.elementFromPoint(ev.clientX, ev.clientY);
        var slot = target && target.closest ? target.closest('.slot') : null;
        if (slot && el.contains(slot)) place(i, slot);
      }
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
    };
  });
  slotEls.forEach(function (s) { s.onclick = function () { if (selTile != null) place(selTile, s); }; });
  $('#clr', el).onclick = function () { fill = {}; slotEls.forEach(function (s) { s.textContent = ''; s.classList.remove('filled'); }); tiles.forEach(function (t) { t.classList.remove('used', 'sel'); }); };
  return {
    get: function () {
      var s = ''; for (var c = cols - 1; c >= 0; c--) { if (fill[c] == null) return ''; s += digits[fill[c]]; }
      return s;
    },
    retry: function () { },
    lock: function () { tiles.forEach(function (t) { t.disabled = true; }); },
    reveal: function () { var s = String(item.target); for (var c = 0; c < cols; c++) { var sl = $('.slot[data-c="' + c + '"]', el); sl.textContent = s[s.length - 1 - c]; } }
  };
};

/* Tap the corners of a shape (mark right angles) */
ITEM_TYPES.corners = function (item, el) {
  var on = {};
  el.innerHTML = (item.visual || '') + '<div class="visual">' + item.svg(true) + '</div><p class="small muted" style="text-align:center">הקישו על הפינות כדי לסמן</p>';
  var marks = $all('.corner', el);
  marks.forEach(function (m) {
    m.addEventListener('click', function () {
      if (m.getAttribute('data-locked')) return;
      var i = Number(m.getAttribute('data-i')); on[i] = !on[i];
      $('.mark[data-i="' + i + '"]', el).setAttribute('opacity', on[i] ? 1 : 0);
    });
  });
  return {
    get: function () { var a = Object.keys(on).filter(function (k) { return on[k]; }).map(Number).sort(); return a; },
    retry: function () { },
    lock: function () { marks.forEach(function (m) { m.setAttribute('data-locked', 1); }); },
    reveal: function () { item.correctCorners.forEach(function (i) { $('.mark[data-i="' + i + '"]', el).setAttribute('opacity', 1); }); }
  };
};

/* Probe angles with a digital "right angle" then answer yes/no */
ITEM_TYPES.probe = function (item, el) {
  var sel = null;
  el.innerHTML = '<div class="visual">' + item.svg(true) + '</div><p class="small muted" style="text-align:center">הקישו על פינה כדי לבדוק אותה עם ה"זווית הישרה"</p><div id="probeinfo" class="small" style="text-align:center;min-height:24px"></div>' +
    '<div class="options two">' + item.options.map(function (o, i) { return '<button class="opt" data-i="' + i + '">' + o.html + '</button>'; }).join('') + '</div>';
  $all('.corner', el).forEach(function (m) {
    m.addEventListener('click', function () {
      var i = Number(m.getAttribute('data-i')); var a = item.angles[i];
      var right = Math.abs(a - 90) < 1;
      $('.mark[data-i="' + i + '"]', el).setAttribute('opacity', 1);
      $('.mark[data-i="' + i + '"]', el).setAttribute('stroke', right ? '#1f9d6b' : '#d9534f');
      $('#probeinfo', el).innerHTML = right ? '✅ הזווית הזאת ישרה' : (a < 90 ? '❌ הזווית הזאת קטנה מזווית ישרה (חדה)' : '❌ הזווית הזאת גדולה מזווית ישרה (קהה)');
    });
  });
  var btns = $all('.opt', el);
  btns.forEach(function (b) { b.onclick = function () { if (b.disabled) return; btns.forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); sel = Number(b.getAttribute('data-i')); }; });
  return {
    get: function () { return sel === null ? '' : sel; },
    retry: function () { if (sel !== null) { btns[sel].classList.add('wrong'); btns[sel].disabled = true; sel = null; } },
    lock: function () { btns.forEach(function (b) { b.disabled = true; }); },
    reveal: function () { item.options.forEach(function (o, i) { if (o.correct) btns[i].classList.add('right'); }); }
  };
};

/* Fill several numeric blanks (e.g. missing side lengths) */
ITEM_TYPES.blanks = function (item, el) {
  el.innerHTML = '<div class="visual">' + item.svg() + '</div>' + item.blanks.map(function (b, i) {
    return '<div class="row" style="justify-content:center;margin:6px 0"><span>' + b.label + '</span><input class="answer-input" style="max-width:110px;font-size:1.3rem" data-b="' + i + '" inputmode="numeric"> <span>' + (b.unit || '') + '</span></div>';
  }).join('');
  var inputs = $all('input', el);
  return {
    get: function () { var vals = inputs.map(function (i) { return i.value.replace(/\D/g, ''); }); if (vals.some(function (v) { return v === ''; })) return ''; return vals.map(Number); },
    retry: function () { },
    lock: function () { inputs.forEach(function (i) { i.disabled = true; }); },
    reveal: function () { inputs.forEach(function (inp, i) { inp.value = item.blanks[i].answer; }); }
  };
};

/* Drag a slider to change a shape (build a rectangle from strips) */
ITEM_TYPES.slider = function (item, el) {
  el.innerHTML = '<div class="visual" id="slvis"></div><div style="text-align:center"><input type="range" class="slider" min="' + item.min + '" max="' + item.max + '" step="' + item.step + '" value="' + item.start + '"><div id="slval" class="small"></div></div>';
  var r = $('input', el);
  function draw() { $('#slvis', el).innerHTML = item.draw(Number(r.value)); $('#slval', el).textContent = item.label(Number(r.value)); }
  r.oninput = draw; draw();
  return { get: function () { return Number(r.value); }, retry: function () { }, lock: function () { r.disabled = true; }, reveal: function () { r.value = item.target; draw(); } };
};
</script>

<script>
/* ================= Error types ================= */
var ERR = {
  no_carry: { label: 'שכחת המרה (העברה לטור הבא)', rec: 'חיבור במאונך בבית המספרים: כל 10 יחידות הופכות לעשרת אחת. כדאי לכתוב את ההעברה בשורה העליונה.' },
  carry20: { label: 'העברת 1 במקום 2 כשסכום הטור 20 ומעלה', rec: 'לפרק את סכום הטור: 21 = 2 עשרות + 1. כותבים 1 ומעבירים 2.' },
  align: { label: 'יישור ספרות לא נכון (מחוברים באורך שונה)', review: 'N0', rec: 'לכתוב את המחוברים בבית המספרים מיושרים לימין: יחידות מתחת ליחידות.' },
  missing_addend: { label: 'דילוג על אחד המחוברים', rec: 'לסמן ✓ ליד כל מחובר שכבר חובר בטור.' },
  calc: { label: 'טעות חישוב', rec: 'חזרה על עובדות חיבור עד 20, ובדיקת התוצאה בעזרת אומדן.' },
  terms: { label: 'מושגים: מחובר וסכום', rec: 'לחזור על המושגים מחובר וסכום עם תרגיל לדוגמה.' },
  word: { label: 'תרגום בעיה מילולית לתרגיל', rec: 'לספר את הבעיה במילים שלכם בלי מספרים, ואז לכתוב תרגיל.' },
  estimate: { label: 'אומדן ועיגול', review: 'N0', rec: 'עיגול לאלפים: בודקים לאיזה אלף שלם המספר קרוב יותר.' },
  place_value: { label: 'ערך הספרה לפי המקום שלה', review: 'N0', rec: 'בית המספרים: לכתוב כל ספרה בעמודה שלה ולפרק את המספר לפי המבנה העשרוני.' },
